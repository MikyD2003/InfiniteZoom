<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Zoom Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-bg-strong: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-blur: 40px;
            --accent-cyan: rgba(0, 255, 255, 0.6);
            --accent-blue: rgba(100, 180, 255, 0.5);
            --accent-purple: rgba(180, 100, 255, 0.5);
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.6);
            --radius: 24px;
            --radius-sm: 20px;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', sans-serif;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            overscroll-behavior: none;
        }

        /* Animated background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 25%, #0a1a2e 50%, #1a1a0a 75%, #0a0a1a 100%);
            background-size: 400% 400%;
            animation: bgShift 20s ease infinite;
        }

        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: orbFloat 15s ease-in-out infinite;
        }

        .orb:nth-child(1) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0,150,255,0.6), transparent 70%);
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .orb:nth-child(2) {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(150,0,255,0.5), transparent 70%);
            bottom: -5%;
            right: -5%;
            animation-delay: -5s;
        }

        .orb:nth-child(3) {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0,255,200,0.4), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Camera container */
        .camera-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            overflow: hidden;
        }

        #cameraFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center center;
            transition: transform 0.05s linear;
            will-change: transform;
        }

        /* Zoom indicator */
        .zoom-indicator {
            position: fixed;
            top: max(20px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 12px 24px;
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.1),
                0 0 20px rgba(0,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .zoom-value {
            font-size: 28px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(135deg, #fff, rgba(100,200,255,0.8));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            min-width: 90px;
            text-align: center;
        }

        .zoom-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
        }

        .zoom-bar {
            width: 100px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .zoom-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue), var(--accent-purple));
            border-radius: 2px;
            transition: width 0.1s ease;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: max(30px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-glass {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.15),
                inset 0 -1px 0 rgba(0,0,0,0.1);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            border-radius: 50% 50% 0 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent);
            pointer-events: none;
        }

        .btn-glass:active {
            transform: scale(0.92);
            background: var(--glass-bg-strong);
            box-shadow: 
                0 4px 16px rgba(0,0,0,0.4),
                inset 0 2px 8px rgba(0,0,0,0.2),
                0 0 30px rgba(0,255,255,0.2);
        }

        .btn-glass svg {
            width: 28px;
            height: 28px;
            stroke: var(--text-primary);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 6px rgba(0,255,255,0.3));
        }

        .btn-glass.main {
            width: 84px;
            height: 84px;
            background: var(--glass-bg-strong);
            border-color: rgba(0,255,255,0.3);
        }

        .btn-glass.main svg {
            width: 32px;
            height: 32px;
        }

        .btn-glass.main::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), transparent 50%, var(--accent-blue));
            opacity: 0.3;
            z-index: -1;
            animation: pulseRing 3s ease-in-out infinite;
        }

        @keyframes pulseRing {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.05); }
        }

        /* Zoom rings effect */
        .zoom-rings {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .zoom-rings.active {
            opacity: 1;
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(0,255,255,0.15);
            animation: ringExpand 3s ease-out infinite;
        }

        .ring:nth-child(1) { width: 100px; height: 100px; animation-delay: 0s; }
        .ring:nth-child(2) { width: 150px; height: 150px; animation-delay: 0.5s; }
        .ring:nth-child(3) { width: 200px; height: 200px; animation-delay: 1s; }

        @keyframes ringExpand {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
        }

        /* Zoom flash */
        .zoom-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,255,255,0.1), transparent 70%);
            z-index: 8;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .zoom-flash.active {
            opacity: 1;
            transition: opacity 0s;
        }

        /* Deep zoom effects */
        .deep-zoom-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .deep-zoom-overlay.level-1 {
            background: radial-gradient(circle at center, transparent 20%, rgba(0,100,255,0.05) 60%, rgba(0,50,200,0.15) 100%);
            opacity: 1;
        }

        .deep-zoom-overlay.level-2 {
            background: radial-gradient(circle at center, transparent 10%, rgba(100,0,255,0.08) 50%, rgba(50,0,200,0.2) 100%);
            opacity: 1;
        }

        .deep-zoom-overlay.level-3 {
            background: radial-gradient(circle at center, transparent 5%, rgba(200,0,255,0.1) 40%, rgba(100,0,255,0.25) 100%);
            opacity: 1;
        }

        .deep-zoom-overlay.level-4 {
            background: radial-gradient(circle at center, rgba(255,0,200,0.05) 0%, rgba(150,0,255,0.15) 50%, rgba(50,0,150,0.35) 100%);
            opacity: 1;
        }

        .deep-zoom-overlay.level-5 {
            background: radial-gradient(circle at center, rgba(255,0,150,0.1) 0%, rgba(200,0,255,0.2) 40%, rgba(0,0,100,0.5) 100%);
            opacity: 1;
            animation: deepPulse 3s ease-in-out infinite;
        }

        @keyframes deepPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        /* Infinity indicator */
        .infinity-badge {
            position: fixed;
            top: max(80px, calc(env(safe-area-inset-top) + 60px));
            left: 50%;
            transform: translateX(-50%) scale(0);
            z-index: 10;
            background: linear-gradient(135deg, rgba(180,100,255,0.2), rgba(0,255,255,0.15));
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid rgba(180,100,255,0.3);
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 30px rgba(180,100,255,0.2);
        }

        .infinity-badge.show {
            transform: translateX(-50%) scale(1);
        }

        .infinity-badge svg {
            width: 20px;
            height: 20px;
            stroke: var(--accent-purple);
            fill: none;
            stroke-width: 2;
        }

        /* Depth indicator */
        .depth-indicator {
            position: fixed;
            right: max(20px, env(safe-area-inset-right));
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .depth-indicator.active {
            opacity: 1;
        }

        .depth-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        .depth-dot.active {
            background: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
            transform: scale(1.3);
        }

        .depth-label {
            font-size: 10px;
            color: var(--text-secondary);
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        /* Permission overlay */
        .permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .permission-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .permission-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 40px 32px;
            max-width: 340px;
            text-align: center;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .permission-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0,255,255,0.2), rgba(100,180,255,0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0,255,255,0.2);
        }

        .permission-icon svg {
            width: 36px;
            height: 36px;
            stroke: var(--accent-cyan);
            fill: none;
            stroke-width: 1.5;
        }

        .permission-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff, rgba(100,200,255,0.9));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .permission-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-enable {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, rgba(0,255,255,0.2), rgba(100,180,255,0.15));
            border: 1px solid rgba(0,255,255,0.3);
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0,255,255,0.1);
        }

        .btn-enable:active {
            transform: scale(0.97);
            background: linear-gradient(135deg, rgba(0,255,255,0.3), rgba(100,180,255,0.25));
        }

        /* Hint toast */
        .hint-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            z-index: 50;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 16px 28px;
            font-size: 14px;
            color: var(--text-primary);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        .hint-toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Loading spinner */
        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 90;
            display: none;
        }

        .loading-spinner.active {
            display: block;
        }

        .spinner-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(0,255,255,0.1);
            border-top-color: var(--accent-cyan);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Zoom level milestones */
        .milestone-reached {
            animation: milestonePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes milestonePop {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.2); }
            100% { transform: translateX(-50%) scale(1); }
        }

        /* Desktop */
        @media (min-width: 768px) {
            .controls { gap: 32px; }
            .btn-glass { width: 80px; height: 80px; }
            .btn-glass.main { width: 96px; height: 96px; }
            .btn-glass:hover {
                background: var(--glass-bg-strong);
                box-shadow: 
                    0 12px 40px rgba(0,0,0,0.4),
                    inset 0 1px 0 rgba(255,255,255,0.2),
                    0 0 40px rgba(0,255,255,0.15);
                transform: translateY(-2px);
            }
            .btn-glass.main:hover { transform: translateY(-3px) scale(1.02); }
        }

        @media (max-width: 380px) {
            .btn-glass { width: 64px; height: 64px; }
            .btn-glass.main { width: 76px; height: 76px; }
            .controls { gap: 16px; }
        }

        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
<base target="_blank">
</head>
<body class="no-select">
    <div class="bg-animation"></div>
    <div class="bg-orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="camera-container">
        <video id="cameraFeed" autoplay playsinline muted></video>
    </div>

    <div class="deep-zoom-overlay" id="deepZoomOverlay"></div>

    <div class="zoom-rings" id="zoomRings">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
    </div>

    <div class="zoom-flash" id="zoomFlash"></div>

    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner-ring"></div>
    </div>

    <div class="zoom-indicator" id="zoomIndicator">
        <span class="zoom-label">Zoom</span>
        <span class="zoom-value" id="zoomValue">1.0×</span>
        <div class="zoom-bar">
            <div class="zoom-fill" id="zoomFill" style="width: 0%"></div>
        </div>
    </div>

    <div class="infinity-badge" id="infinityBadge">
        <svg viewBox="0 0 24 24">
            <path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.739-8-4.585 0-4.585 8 0 8 5.606 0 7.644-8 12.74-8z"></path>
        </svg>
        <span>Infinite Zoom</span>
    </div>

    <div class="depth-indicator" id="depthIndicator">
        <div class="depth-dot active" data-level="0"></div>
        <div class="depth-dot" data-level="1"></div>
        <div class="depth-dot" data-level="2"></div>
        <div class="depth-dot" data-level="3"></div>
        <div class="depth-dot" data-level="4"></div>
        <div class="depth-dot" data-level="5"></div>
        <div class="depth-dot" data-level="6"></div>
        <div class="depth-dot" data-level="7"></div>
        <div class="depth-label">Depth</div>
    </div>

    <div class="controls">
        <button class="btn-glass" id="zoomOutBtn" aria-label="Zoom Out">
            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
        </button>

        <button class="btn-glass main" id="resetBtn" aria-label="Reset Zoom">
            <svg viewBox="0 0 24 24">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>

        <button class="btn-glass" id="zoomInBtn" aria-label="Zoom In">
            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
                <line x1="11" y1="8" x2="11" y2="14"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
        </button>
    </div>

    <div class="permission-overlay" id="permissionOverlay">
        <div class="permission-card">
            <div class="permission-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M23 7l-7 5 7 5V7z"></path>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
            </div>
            <div class="permission-title">Camera Access</div>
            <div class="permission-text">
                Infinite Zoom needs access to your camera. Zoom to infinity with pinch gestures or buttons. Your video never leaves your device.
            </div>
            <button class="btn-enable" id="enableCameraBtn">Enable Camera</button>
        </div>
    </div>

    <div class="hint-toast" id="hintToast"></div>

    <script>
        (function() {
            'use strict';

            const video = document.getElementById('cameraFeed');
            const zoomInBtn = document.getElementById('zoomInBtn');
            const zoomOutBtn = document.getElementById('zoomOutBtn');
            const resetBtn = document.getElementById('resetBtn');
            const zoomValue = document.getElementById('zoomValue');
            const zoomFill = document.getElementById('zoomFill');
            const zoomIndicator = document.getElementById('zoomIndicator');
            const zoomRings = document.getElementById('zoomRings');
            const zoomFlash = document.getElementById('zoomFlash');
            const deepZoomOverlay = document.getElementById('deepZoomOverlay');
            const infinityBadge = document.getElementById('infinityBadge');
            const depthIndicator = document.getElementById('depthIndicator');
            const depthDots = document.querySelectorAll('.depth-dot');
            const permissionOverlay = document.getElementById('permissionOverlay');
            const enableCameraBtn = document.getElementById('enableCameraBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const hintToast = document.getElementById('hintToast');

            // INFINITE ZOOM STATE
            let currentZoom = 1;
            let targetZoom = 1;
            let minZoom = 1;
            // NO MAX ZOOM - truly infinite!
            let animationId = null;
            let stream = null;
            let lastHintTime = 0;
            let lastMilestone = 0;

            // Milestones for visual feedback
            const milestones = [2, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000];

            function haptic(style = 'light') {
                if (navigator.vibrate) {
                    const patterns = {
                        light: [10],
                        medium: [20],
                        heavy: [30],
                        error: [50, 50, 50],
                        infinite: [10, 50, 10, 50, 30]
                    };
                    navigator.vibrate(patterns[style] || patterns.light);
                }
            }

            function showHint(text, duration = 2000) {
                const now = Date.now();
                if (now - lastHintTime < 500) return;
                lastHintTime = now;
                hintToast.textContent = text;
                hintToast.classList.add('show');
                setTimeout(() => hintToast.classList.remove('show'), duration);
            }

            function triggerFlash() {
                zoomFlash.classList.add('active');
                setTimeout(() => zoomFlash.classList.remove('active'), 100);
            }

            function formatZoom(zoom) {
                if (zoom < 10) return zoom.toFixed(1) + '×';
                if (zoom < 100) return Math.round(zoom) + '×';
                if (zoom < 1000) return Math.round(zoom) + '×';
                if (zoom < 10000) return (zoom / 1000).toFixed(1) + 'K×';
                if (zoom < 1000000) return Math.round(zoom / 1000) + 'K×';
                return (zoom / 1000000).toFixed(1) + 'M×';
            }

            function getDepthLevel(zoom) {
                // Logarithmic depth levels
                if (zoom < 2) return 0;
                if (zoom < 5) return 1;
                if (zoom < 10) return 2;
                if (zoom < 25) return 3;
                if (zoom < 50) return 4;
                if (zoom < 100) return 5;
                if (zoom < 500) return 6;
                return 7;
            }

            function getOverlayLevel(zoom) {
                if (zoom < 5) return 0;
                if (zoom < 20) return 1;
                if (zoom < 100) return 2;
                if (zoom < 500) return 3;
                if (zoom < 2000) return 4;
                return 5;
            }

            function checkMilestones(zoom) {
                for (let m of milestones) {
                    if (lastMilestone < m && zoom >= m) {
                        lastMilestone = m;
                        haptic('infinite');
                        zoomIndicator.classList.add('milestone-reached');
                        setTimeout(() => zoomIndicator.classList.remove('milestone-reached'), 600);

                        if (m >= 100) {
                            showHint('🌌 Entering deep space...', 1500);
                        } else if (m >= 10) {
                            showHint('✨ ' + formatZoom(m) + ' reached!', 1200);
                        }
                        break;
                    }
                }
                if (zoom < lastMilestone) {
                    lastMilestone = 0;
                }
            }

            function updateUI() {
                // Zoom display
                zoomValue.textContent = formatZoom(currentZoom);

                // Progress bar (logarithmic for infinite feel)
                const logZoom = Math.log(currentZoom);
                const logMax = Math.log(10000); // Visual reference at 10K
                const progress = Math.min(100, (logZoom / logMax) * 100);
                zoomFill.style.width = progress + '%';

                // Video transform
                video.style.transform = `scale(${currentZoom})`;

                // Depth indicator
                const depthLevel = getDepthLevel(currentZoom);
                depthDots.forEach((dot, i) => {
                    dot.classList.toggle('active', i <= depthLevel && currentZoom > 1.1);
                });
                depthIndicator.classList.toggle('active', currentZoom > 1.2);

                // Deep zoom overlay
                const overlayLevel = getOverlayLevel(currentZoom);
                deepZoomOverlay.className = 'deep-zoom-overlay';
                if (overlayLevel > 0) {
                    deepZoomOverlay.classList.add('level-' + overlayLevel);
                }

                // Infinity badge at extreme zoom
                infinityBadge.classList.toggle('show', currentZoom >= 100);

                // Zoom rings
                zoomRings.classList.toggle('active', currentZoom > 3);

                // Check milestones
                checkMilestones(currentZoom);
            }

            function animateZoom() {
                const diff = targetZoom - currentZoom;

                if (Math.abs(diff) < 0.0001) {
                    currentZoom = targetZoom;
                    updateUI();
                    animationId = null;
                    return;
                }

                // Faster easing for responsive feel
                currentZoom += diff * 0.2;
                updateUI();

                animationId = requestAnimationFrame(animateZoom);
            }

            function startZoomAnimation() {
                if (!animationId) {
                    animationId = requestAnimationFrame(animateZoom);
                }
            }

            // EXPONENTIAL ZOOM IN - accelerates to infinity
            function zoomIn() {
                // Exponential growth: the deeper you go, the faster it zooms
                const multiplier = 1 + (0.3 / Math.sqrt(currentZoom));
                targetZoom = currentZoom * (1 + multiplier);
                haptic('light');
                triggerFlash();
                startZoomAnimation();
            }

            // EXPONENTIAL ZOOM OUT
            function zoomOut() {
                if (targetZoom <= minZoom) {
                    haptic('error');
                    showHint('Minimum zoom reached');
                    return;
                }
                const multiplier = 1 + (0.3 / Math.sqrt(currentZoom));
                targetZoom = currentZoom / (1 + multiplier);
                if (targetZoom < minZoom) targetZoom = minZoom;
                haptic('light');
                triggerFlash();
                startZoomAnimation();
            }

            function resetZoom() {
                if (targetZoom === minZoom) {
                    haptic('medium');
                    showHint('Already at normal view');
                    return;
                }
                targetZoom = minZoom;
                haptic('medium');
                triggerFlash();
                startZoomAnimation();
                showHint('Returned to normal view');
            }

            // PINCH TO ZOOM - smooth and infinite
            let touches = new Map();
            let lastPinchDistance = 0;
            let pinchStartZoom = 1;
            let isPinching = false;

            function getPinchDistance(touch1, touch2) {
                const dx = touch1.clientX - touch2.clientX;
                const dy = touch1.clientY - touch2.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            function getPinchCenter(touch1, touch2) {
                return {
                    x: (touch1.clientX + touch2.clientX) / 2,
                    y: (touch1.clientY + touch2.clientY) / 2
                };
            }

            document.addEventListener('touchstart', (e) => {
                for (let touch of e.changedTouches) {
                    touches.set(touch.identifier, {
                        x: touch.clientX,
                        y: touch.clientY,
                        startX: touch.clientX,
                        startY: touch.clientY
                    });
                }

                if (e.touches.length === 2) {
                    isPinching = true;
                    lastPinchDistance = getPinchDistance(e.touches[0], e.touches[1]);
                    pinchStartZoom = targetZoom;
                    e.preventDefault();
                }
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                for (let touch of e.changedTouches) {
                    if (touches.has(touch.identifier)) {
                        const t = touches.get(touch.identifier);
                        t.x = touch.clientX;
                        t.y = touch.clientY;
                    }
                }

                if (e.touches.length === 2 && isPinching) {
                    e.preventDefault();

                    const currentDistance = getPinchDistance(e.touches[0], e.touches[1]);
                    const scale = currentDistance / lastPinchDistance;

                    // Direct zoom control during pinch - feels instant and infinite
                    targetZoom = Math.max(minZoom, pinchStartZoom * scale);
                    currentZoom = targetZoom;
                    updateUI();

                    haptic('light');
                }
            }, { passive: false });

            document.addEventListener('touchend', (e) => {
                for (let touch of e.changedTouches) {
                    touches.delete(touch.identifier);
                }

                if (e.touches.length < 2) {
                    isPinching = false;
                    // Smooth settle after pinch
                    startZoomAnimation();
                }

                // Double tap detection
                if (e.touches.length === 0) {
                    const now = Date.now();
                    if (now - (lastTapTime || 0) < 300) {
                        if (targetZoom > minZoom * 1.1) {
                            resetZoom();
                        } else {
                            targetZoom = 3;
                            startZoomAnimation();
                            haptic('medium');
                        }
                    }
                    lastTapTime = now;
                }
            }, { passive: true });

            let lastTapTime = 0;

            // Mouse wheel zoom (desktop) - exponential
            document.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                targetZoom = Math.max(minZoom, targetZoom * delta);
                startZoomAnimation();
            }, { passive: false });

            // Button events
            zoomInBtn.addEventListener('click', zoomIn);
            zoomOutBtn.addEventListener('click', zoomOut);
            resetBtn.addEventListener('click', resetZoom);

            // Hold to continuously zoom
            let holdInterval = null;
            let holdDelay = null;

            function startHoldZoom(direction) {
                holdDelay = setTimeout(() => {
                    holdInterval = setInterval(() => {
                        if (direction === 'in') {
                            zoomIn();
                        } else {
                            zoomOut();
                        }
                    }, 100);
                }, 300);
            }

            function stopHoldZoom() {
                clearTimeout(holdDelay);
                clearInterval(holdInterval);
                holdDelay = null;
                holdInterval = null;
            }

            zoomInBtn.addEventListener('touchstart', () => startHoldZoom('in'));
            zoomInBtn.addEventListener('touchend', stopHoldZoom);
            zoomInBtn.addEventListener('mousedown', () => startHoldZoom('in'));
            zoomInBtn.addEventListener('mouseup', stopHoldZoom);
            zoomInBtn.addEventListener('mouseleave', stopHoldZoom);

            zoomOutBtn.addEventListener('touchstart', () => startHoldZoom('out'));
            zoomOutBtn.addEventListener('touchend', stopHoldZoom);
            zoomOutBtn.addEventListener('mousedown', () => startHoldZoom('out'));
            zoomOutBtn.addEventListener('mouseup', stopHoldZoom);
            zoomOutBtn.addEventListener('mouseleave', stopHoldZoom);

            enableCameraBtn.addEventListener('click', initCamera);

            // Keyboard
            document.addEventListener('keydown', (e) => {
                if (e.key === '+' || e.key === '=') zoomIn();
                if (e.key === '-' || e.key === '_') zoomOut();
                if (e.key === '0' || e.key === 'r' || e.key === 'R') resetZoom();
            });

            document.addEventListener('contextmenu', (e) => e.preventDefault());

            async function initCamera() {
                loadingSpinner.classList.add('active');

                try {
                    const constraints = {
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        },
                        audio: false
                    };

                    stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;

                    video.onloadedmetadata = () => {
                        loadingSpinner.classList.remove('active');
                        permissionOverlay.classList.add('hidden');

                        video.style.opacity = '0';
                        video.style.transition = 'opacity 1s ease';
                        requestAnimationFrame(() => {
                            video.style.opacity = '1';
                        });

                        haptic('medium');
                        showHint('Pinch to zoom infinitely ✨', 3000);
                    };

                } catch (err) {
                    console.error('Camera error:', err);
                    loadingSpinner.classList.remove('active');
                    showHint('Camera unavailable. Demo mode active.', 3000);
                    createDemoFeed();
                    permissionOverlay.classList.add('hidden');
                }
            }

            function createDemoFeed() {
                const canvas = document.createElement('canvas');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                canvas.style.width = '100%';
                canvas.style.height = '100%';
                const ctx = canvas.getContext('2d');

                const container = video.parentElement;
                container.replaceChild(canvas, video);

                let time = 0;
                function animate() {
                    time += 0.005;

                    const gradient = ctx.createRadialGradient(
                        canvas.width/2 + Math.sin(time) * 200,
                        canvas.height/2 + Math.cos(time) * 200,
                        0,
                        canvas.width/2,
                        canvas.height/2,
                        Math.max(canvas.width, canvas.height) * 2
                    );

                    gradient.addColorStop(0, `hsl(${(time * 30) % 360}, 70%, 60%)`);
                    gradient.addColorStop(0.3, `hsl(${(time * 30 + 60) % 360}, 60%, 40%)`);
                    gradient.addColorStop(0.6, `hsl(${(time * 30 + 180) % 360}, 70%, 25%)`);
                    gradient.addColorStop(1, `hsl(${(time * 30 + 300) % 360}, 80%, 15%)`);

                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Fractal-like circles
                    for (let i = 0; i < 12; i++) {
                        const angle = (i / 12) * Math.PI * 2 + time;
                        const dist = 150 + Math.sin(time * 2 + i) * 80;
                        ctx.beginPath();
                        ctx.arc(
                            canvas.width/2 + Math.cos(angle) * dist,
                            canvas.height/2 + Math.sin(angle) * dist,
                            30 + Math.sin(time * 3 + i * 0.5) * 15,
                            0,
                            Math.PI * 2
                        );
                        ctx.strokeStyle = `hsla(${(time * 50 + i * 30) % 360}, 80%, 70%, 0.4)`;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }

                    // Center mandala
                    for (let ring = 0; ring < 5; ring++) {
                        const radius = 50 + ring * 40 + Math.sin(time * 2 + ring) * 10;
                        const segments = 6 + ring * 2;
                        for (let s = 0; s < segments; s++) {
                            const angle = (s / segments) * Math.PI * 2 + time * (ring % 2 === 0 ? 1 : -1);
                            ctx.beginPath();
                            ctx.arc(
                                canvas.width/2 + Math.cos(angle) * radius,
                                canvas.height/2 + Math.sin(angle) * radius,
                                8,
                                0,
                                Math.PI * 2
                            );
                            ctx.fillStyle = `hsla(${(time * 80 + ring * 60 + s * 20) % 360}, 90%, 65%, 0.6)`;
                            ctx.fill();
                        }
                    }

                    requestAnimationFrame(animate);
                }
                animate();

                // Override updateUI for canvas
                const origUpdateUI = updateUI;
                updateUI = function() {
                    canvas.style.transform = `scale(${currentZoom})`;
                    canvas.style.transformOrigin = 'center center';
                    zoomValue.textContent = formatZoom(currentZoom);
                    const logZoom = Math.log(currentZoom);
                    const logMax = Math.log(10000);
                    const progress = Math.min(100, (logZoom / logMax) * 100);
                    zoomFill.style.width = progress + '%';

                    const depthLevel = getDepthLevel(currentZoom);
                    depthDots.forEach((dot, i) => {
                        dot.classList.toggle('active', i <= depthLevel && currentZoom > 1.1);
                    });
                    depthIndicator.classList.toggle('active', currentZoom > 1.2);

                    const overlayLevel = getOverlayLevel(currentZoom);
                    deepZoomOverlay.className = 'deep-zoom-overlay';
                    if (overlayLevel > 0) {
                        deepZoomOverlay.classList.add('level-' + overlayLevel);
                    }

                    infinityBadge.classList.toggle('show', currentZoom >= 100);
                    zoomRings.classList.toggle('active', currentZoom > 3);
                    checkMilestones(currentZoom);
                };
            }

            // Auto-init check
            updateUI();

            setTimeout(() => {
                if (navigator.permissions && navigator.permissions.query) {
                    navigator.permissions.query({ name: 'camera' }).then((result) => {
                        if (result.state === 'granted') {
                            initCamera();
                        }
                    }).catch(() => {});
                }
            }, 500);

        })();
    </script>
</body>
