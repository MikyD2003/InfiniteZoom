<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Zoom Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-bg-strong: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-blur: 40px;
            --accent-cyan: rgba(0, 255, 255, 0.6);
            --accent-blue: rgba(100, 180, 255, 0.5);
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.6);
            --radius: 24px;
            --radius-sm: 20px;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', sans-serif;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animated background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 25%, #0a1a2e 50%, #1a1a0a 75%, #0a0a1a 100%);
            background-size: 400% 400%;
            animation: bgShift 20s ease infinite;
        }

        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: orbFloat 15s ease-in-out infinite;
        }

        .orb:nth-child(1) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0,150,255,0.6), transparent 70%);
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .orb:nth-child(2) {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(150,0,255,0.5), transparent 70%);
            bottom: -5%;
            right: -5%;
            animation-delay: -5s;
        }

        .orb:nth-child(3) {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0,255,200,0.4), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Camera container */
        .camera-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            overflow: hidden;
        }

        #cameraFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }

        /* Zoom indicator */
        .zoom-indicator {
            position: fixed;
            top: max(20px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 12px 24px;
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.1),
                0 0 20px rgba(0,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .zoom-value {
            font-size: 28px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(135deg, #fff, rgba(100,200,255,0.8));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            min-width: 80px;
            text-align: center;
        }

        .zoom-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
        }

        .zoom-bar {
            width: 100px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .zoom-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 2px;
            transition: width 0.15s ease;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: max(30px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-glass {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 8px 32px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.15),
                inset 0 -1px 0 rgba(0,0,0,0.1);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            border-radius: 50% 50% 0 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent);
            pointer-events: none;
        }

        .btn-glass:active {
            transform: scale(0.92);
            background: var(--glass-bg-strong);
            box-shadow: 
                0 4px 16px rgba(0,0,0,0.4),
                inset 0 2px 8px rgba(0,0,0,0.2),
                0 0 30px rgba(0,255,255,0.2);
        }

        .btn-glass svg {
            width: 28px;
            height: 28px;
            stroke: var(--text-primary);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 6px rgba(0,255,255,0.3));
        }

        .btn-glass.main {
            width: 84px;
            height: 84px;
            background: var(--glass-bg-strong);
            border-color: rgba(0,255,255,0.3);
        }

        .btn-glass.main svg {
            width: 32px;
            height: 32px;
        }

        .btn-glass.main::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), transparent 50%, var(--accent-blue));
            opacity: 0.3;
            z-index: -1;
            animation: pulseRing 3s ease-in-out infinite;
        }

        @keyframes pulseRing {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.05); }
        }

        /* Zoom level rings decoration */
        .zoom-rings {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .zoom-rings.active {
            opacity: 1;
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(0,255,255,0.15);
            animation: ringExpand 3s ease-out infinite;
        }

        .ring:nth-child(1) { width: 100px; height: 100px; animation-delay: 0s; }
        .ring:nth-child(2) { width: 150px; height: 150px; animation-delay: 0.5s; }
        .ring:nth-child(3) { width: 200px; height: 200px; animation-delay: 1s; }

        @keyframes ringExpand {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
        }

        /* Flash effect on zoom */
        .zoom-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,255,255,0.1), transparent 70%);
            z-index: 8;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .zoom-flash.active {
            opacity: 1;
            transition: opacity 0s;
        }

        /* Permission prompt */
        .permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .permission-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .permission-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 40px 32px;
            max-width: 340px;
            text-align: center;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .permission-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0,255,255,0.2), rgba(100,180,255,0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0,255,255,0.2);
        }

        .permission-icon svg {
            width: 36px;
            height: 36px;
            stroke: var(--accent-cyan);
            fill: none;
            stroke-width: 1.5;
        }

        .permission-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff, rgba(100,200,255,0.9));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .permission-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-enable {
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, rgba(0,255,255,0.2), rgba(100,180,255,0.15));
            border: 1px solid rgba(0,255,255,0.3);
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0,255,255,0.1);
        }

        .btn-enable:active {
            transform: scale(0.97);
            background: linear-gradient(135deg, rgba(0,255,255,0.3), rgba(100,180,255,0.25));
        }

        /* Hint toast */
        .hint-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            z-index: 50;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 16px 28px;
            font-size: 14px;
            color: var(--text-primary);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .hint-toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Infinite zoom depth indicator */
        .depth-indicator {
            position: fixed;
            right: max(20px, env(safe-area-inset-right));
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .depth-indicator.active {
            opacity: 1;
        }

        .depth-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        .depth-dot.active {
            background: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
            transform: scale(1.3);
        }

        .depth-label {
            font-size: 10px;
            color: var(--text-secondary);
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        /* Max zoom glow */
        .max-zoom-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 7;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,255,255,0.05) 70%, rgba(0,255,255,0.12) 100%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .max-zoom-glow.active {
            opacity: 1;
            animation: maxZoomPulse 2s ease-in-out infinite;
        }

        @keyframes maxZoomPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Loading state */
        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 90;
            display: none;
        }

        .loading-spinner.active {
            display: block;
        }

        .spinner-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(0,255,255,0.1);
            border-top-color: var(--accent-cyan);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Desktop adjustments */
        @media (min-width: 768px) {
            .controls {
                gap: 32px;
            }

            .btn-glass {
                width: 80px;
                height: 80px;
            }

            .btn-glass.main {
                width: 96px;
                height: 96px;
            }

            .btn-glass:hover {
                background: var(--glass-bg-strong);
                box-shadow: 
                    0 12px 40px rgba(0,0,0,0.4),
                    inset 0 1px 0 rgba(255,255,255,0.2),
                    0 0 40px rgba(0,255,255,0.15);
                transform: translateY(-2px);
            }

            .btn-glass.main:hover {
                transform: translateY(-3px) scale(1.02);
            }
        }

        /* Small phones */
        @media (max-width: 380px) {
            .btn-glass {
                width: 64px;
                height: 64px;
            }

            .btn-glass.main {
                width: 76px;
                height: 76px;
            }

            .controls {
                gap: 16px;
            }
        }

        /* Prevent text selection */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
<base target="_blank">
</head>
<body class="no-select">
    <!-- Animated Background -->
    <div class="bg-animation"></div>
    <div class="bg-orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- Camera Feed -->
    <div class="camera-container">
        <video id="cameraFeed" autoplay playsinline muted></video>
    </div>

    <!-- Zoom Rings Effect -->
    <div class="zoom-rings" id="zoomRings">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
    </div>

    <!-- Zoom Flash -->
    <div class="zoom-flash" id="zoomFlash"></div>

    <!-- Max Zoom Glow -->
    <div class="max-zoom-glow" id="maxZoomGlow"></div>

    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner-ring"></div>
    </div>

    <!-- Zoom Indicator -->
    <div class="zoom-indicator">
        <span class="zoom-label">Zoom</span>
        <span class="zoom-value" id="zoomValue">1.0×</span>
        <div class="zoom-bar">
            <div class="zoom-fill" id="zoomFill" style="width: 0%"></div>
        </div>
    </div>

    <!-- Depth Indicator -->
    <div class="depth-indicator" id="depthIndicator">
        <div class="depth-dot active" data-level="0"></div>
        <div class="depth-dot" data-level="1"></div>
        <div class="depth-dot" data-level="2"></div>
        <div class="depth-dot" data-level="3"></div>
        <div class="depth-dot" data-level="4"></div>
        <div class="depth-label">Depth</div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn-glass" id="zoomOutBtn" aria-label="Zoom Out">
            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
        </button>

        <button class="btn-glass main" id="resetBtn" aria-label="Reset Zoom">
            <svg viewBox="0 0 24 24">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </button>

        <button class="btn-glass" id="zoomInBtn" aria-label="Zoom In">
            <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7"></circle>
                <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
                <line x1="11" y1="8" x2="11" y2="14"></line>
                <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
        </button>
    </div>

    <!-- Permission Overlay -->
    <div class="permission-overlay" id="permissionOverlay">
        <div class="permission-card">
            <div class="permission-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M23 7l-7 5 7 5V7z"></path>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
            </div>
            <div class="permission-title">Camera Access</div>
            <div class="permission-text">
                Infinite Zoom needs access to your camera to create a mesmerizing zoom experience. Your video never leaves your device.
            </div>
            <button class="btn-enable" id="enableCameraBtn">Enable Camera</button>
        </div>
    </div>

    <!-- Hint Toast -->
    <div class="hint-toast" id="hintToast"></div>

    <script>
        (function() {
            'use strict';

            // Elements
            const video = document.getElementById('cameraFeed');
            const zoomInBtn = document.getElementById('zoomInBtn');
            const zoomOutBtn = document.getElementById('zoomOutBtn');
            const resetBtn = document.getElementById('resetBtn');
            const zoomValue = document.getElementById('zoomValue');
            const zoomFill = document.getElementById('zoomFill');
            const zoomRings = document.getElementById('zoomRings');
            const zoomFlash = document.getElementById('zoomFlash');
            const maxZoomGlow = document.getElementById('maxZoomGlow');
            const depthIndicator = document.getElementById('depthIndicator');
            const depthDots = document.querySelectorAll('.depth-dot');
            const permissionOverlay = document.getElementById('permissionOverlay');
            const enableCameraBtn = document.getElementById('enableCameraBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const hintToast = document.getElementById('hintToast');

            // State
            let currentZoom = 1;
            let targetZoom = 1;
            let minZoom = 1;
            let maxZoom = 10;
            let zoomStep = 0.5;
            let animationId = null;
            let stream = null;
            let lastHintTime = 0;

            // Haptic feedback
            function haptic(style = 'light') {
                if (navigator.vibrate) {
                    const patterns = {
                        light: [10],
                        medium: [20],
                        heavy: [30],
                        error: [50, 50, 50]
                    };
                    navigator.vibrate(patterns[style] || patterns.light);
                }
            }

            // Show hint
            function showHint(text, duration = 2000) {
                const now = Date.now();
                if (now - lastHintTime < 500) return;
                lastHintTime = now;

                hintToast.textContent = text;
                hintToast.classList.add('show');
                setTimeout(() => hintToast.classList.remove('show'), duration);
            }

            // Flash effect
            function triggerFlash() {
                zoomFlash.classList.add('active');
                setTimeout(() => zoomFlash.classList.remove('active'), 100);
            }

            // Update UI
            function updateUI() {
                // Zoom value display
                zoomValue.textContent = currentZoom.toFixed(1) + '×';

                // Zoom bar
                const progress = ((currentZoom - minZoom) / (maxZoom - minZoom)) * 100;
                zoomFill.style.width = Math.min(100, Math.max(0, progress)) + '%';

                // Video transform
                video.style.transform = `scale(${currentZoom})`;

                // Depth indicator
                const depthLevel = Math.min(4, Math.floor((currentZoom - 1) / 2));
                depthDots.forEach((dot, i) => {
                    dot.classList.toggle('active', i <= depthLevel && currentZoom > 1);
                });

                // Show/hide depth indicator
                depthIndicator.classList.toggle('active', currentZoom > 1.2);

                // Max zoom glow
                maxZoomGlow.classList.toggle('active', currentZoom >= maxZoom * 0.95);

                // Zoom rings on significant zoom
                zoomRings.classList.toggle('active', currentZoom > 2);
            }

            // Smooth zoom animation
            function animateZoom() {
                const diff = targetZoom - currentZoom;

                if (Math.abs(diff) < 0.001) {
                    currentZoom = targetZoom;
                    updateUI();
                    animationId = null;
                    return;
                }

                // Ease towards target
                currentZoom += diff * 0.15;
                updateUI();

                animationId = requestAnimationFrame(animateZoom);
            }

            // Start zoom animation
            function startZoomAnimation() {
                if (!animationId) {
                    animationId = requestAnimationFrame(animateZoom);
                }
            }

            // Zoom in
            function zoomIn() {
                if (targetZoom >= maxZoom) {
                    haptic('error');
                    showHint('Maximum zoom reached');
                    return;
                }

                targetZoom = Math.min(maxZoom, targetZoom + zoomStep);
                haptic('light');
                triggerFlash();
                startZoomAnimation();

                // Dynamic step increase for "infinite" feel
                if (targetZoom > 3) zoomStep = 0.8;
                if (targetZoom > 6) zoomStep = 1.2;
            }

            // Zoom out
            function zoomOut() {
                if (targetZoom <= minZoom) {
                    haptic('error');
                    showHint('Minimum zoom reached');
                    return;
                }

                targetZoom = Math.max(minZoom, targetZoom - zoomStep);
                haptic('light');
                triggerFlash();
                startZoomAnimation();

                // Reset step when zooming out
                if (targetZoom <= 3) zoomStep = 0.5;
                if (targetZoom <= 6) zoomStep = 0.8;
            }

            // Reset zoom
            function resetZoom() {
                if (targetZoom === minZoom) {
                    haptic('medium');
                    showHint('Already at normal view');
                    return;
                }

                targetZoom = minZoom;
                zoomStep = 0.5;
                haptic('medium');
                triggerFlash();
                startZoomAnimation();
                showHint('Returned to normal view');
            }

            // Camera initialization
            async function initCamera() {
                loadingSpinner.classList.add('active');

                try {
                    // Try to get back camera first for mobile
                    const constraints = {
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        },
                        audio: false
                    };

                    stream = await navigator.mediaDevices.getUserMedia(constraints);

                    // If we get here, permission granted
                    video.srcObject = stream;

                    video.onloadedmetadata = () => {
                        loadingSpinner.classList.remove('active');
                        permissionOverlay.classList.add('hidden');

                        // Animate in
                        video.style.opacity = '0';
                        video.style.transition = 'opacity 1s ease';
                        requestAnimationFrame(() => {
                            video.style.opacity = '1';
                        });

                        haptic('medium');
                        showHint('Pinch or use buttons to zoom', 3000);
                    };

                } catch (err) {
                    console.error('Camera error:', err);
                    loadingSpinner.classList.remove('active');

                    // Show fallback message
                    showHint('Camera access denied. Using demo mode.', 3000);

                    // Create a canvas-based demo feed
                    createDemoFeed();
                    permissionOverlay.classList.add('hidden');
                }
            }

            // Demo feed for when camera is unavailable
            function createDemoFeed() {
                const canvas = document.createElement('canvas');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const ctx = canvas.getContext('2d');

                // Replace video with canvas
                const container = video.parentElement;
                container.replaceChild(canvas, video);

                // Animated gradient demo
                let time = 0;
                function animate() {
                    time += 0.01;

                    const gradient = ctx.createRadialGradient(
                        canvas.width/2 + Math.sin(time) * 100,
                        canvas.height/2 + Math.cos(time) * 100,
                        0,
                        canvas.width/2,
                        canvas.height/2,
                        Math.max(canvas.width, canvas.height)
                    );

                    gradient.addColorStop(0, `hsl(${time * 50 % 360}, 70%, 50%)`);
                    gradient.addColorStop(0.5, `hsl(${(time * 50 + 120) % 360}, 60%, 30%)`);
                    gradient.addColorStop(1, `hsl(${(time * 50 + 240) % 360}, 80%, 20%)`);

                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Add some geometric shapes
                    for (let i = 0; i < 5; i++) {
                        ctx.beginPath();
                        ctx.arc(
                            canvas.width/2 + Math.sin(time + i) * 200,
                            canvas.height/2 + Math.cos(time + i) * 200,
                            50 + Math.sin(time * 2 + i) * 20,
                            0,
                            Math.PI * 2
                        );
                        ctx.strokeStyle = `hsla(${time * 100 + i * 72}, 80%, 70%, 0.3)`;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }

                    requestAnimationFrame(animate);
                }
                animate();

                // Update transform on canvas
                const originalUpdateUI = updateUI;
                updateUI = function() {
                    canvas.style.transform = `scale(${currentZoom})`;
                    canvas.style.transformOrigin = 'center center';
                    originalUpdateUI.call(this);
                    // Override video-specific updates
                    zoomValue.textContent = currentZoom.toFixed(1) + '×';
                    const progress = ((currentZoom - minZoom) / (maxZoom - minZoom)) * 100;
                    zoomFill.style.width = Math.min(100, Math.max(0, progress)) + '%';
                };
            }

            // Touch gesture support (pinch to zoom)
            let initialDistance = 0;
            let initialZoom = 1;

            function getTouchDistance(touches) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            document.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    initialDistance = getTouchDistance(e.touches);
                    initialZoom = targetZoom;
                }
            }, { passive: true });

            document.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const currentDistance = getTouchDistance(e.touches);
                    const scale = currentDistance / initialDistance;
                    targetZoom = Math.min(maxZoom, Math.max(minZoom, initialZoom * scale));
                    startZoomAnimation();
                }
            }, { passive: false });

            // Mouse wheel zoom (desktop)
            document.addEventListener('wheel', (e) => {
                if (e.deltaY < 0) {
                    targetZoom = Math.min(maxZoom, targetZoom + 0.2);
                } else {
                    targetZoom = Math.max(minZoom, targetZoom - 0.2);
                }
                startZoomAnimation();
            }, { passive: true });

            // Button events
            zoomInBtn.addEventListener('click', zoomIn);
            zoomOutBtn.addEventListener('click', zoomOut);
            resetBtn.addEventListener('click', resetZoom);

            // Enable camera button
            enableCameraBtn.addEventListener('click', initCamera);

            // Keyboard shortcuts (desktop)
            document.addEventListener('keydown', (e) => {
                if (e.key === '+' || e.key === '=') zoomIn();
                if (e.key === '-' || e.key === '_') zoomOut();
                if (e.key === '0' || e.key === 'r') resetZoom();
            });

            // Double tap to zoom (mobile)
            let lastTap = 0;
            document.addEventListener('touchend', (e) => {
                const now = Date.now();
                const doubleTapDelay = 300;

                if (now - lastTap < doubleTapDelay && e.touches.length === 0) {
                    // Double tap detected
                    if (targetZoom > minZoom) {
                        resetZoom();
                    } else {
                        targetZoom = 2;
                        startZoomAnimation();
                        haptic('medium');
                    }
                }
                lastTap = now;
            }, { passive: true });

            // Prevent context menu on long press
            document.addEventListener('contextmenu', (e) => e.preventDefault());

            // Handle page visibility
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && stream) {
                    // Optionally pause stream
                }
            });

            // Initialize
            updateUI();

            // Auto-request on load for better UX
            setTimeout(() => {
                // Check if already granted
                if (navigator.permissions && navigator.permissions.query) {
                    navigator.permissions.query({ name: 'camera' }).then((result) => {
                        if (result.state === 'granted') {
                            initCamera();
                        }
                    }).catch(() => {});
                }
            }, 500);

        })();
    </script>
</body>
</html>
